name: frontend-ci

on:
  push:
    branches:
      - main
      - master
      - develop
      - refactor_codebase_v3
  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build project
        run: npm run build

  # e2e chạy FE thật trên BE thật + Mongo thật — không msw, không mock ở tầng HTTP.
  # Kịch bản cố ý KHÔNG chạy step AI: provider chọn theo frontmatter từng skill và `mock.provider.ts`
  # trả JSON không khớp schema pipeline, nên bật mock cũng không sinh được op (xem e2e/workspace.spec.ts).
  # Nội dung được gieo bằng op qua `POST /changes` — vẫn đi qua op engine và invariants thật.
  e2e:
    runs-on: ubuntu-latest
    needs: build
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      # `flintflow_be` là repo public nên `GITHUB_TOKEN` mặc định đọc được, không cần secret riêng.
      # Nếu sau này chuyển sang private thì thêm `token: ${{ secrets.BE_REPO_TOKEN }}` (PAT có quyền
      # đọc Contents của repo đó).
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: mit-suu/flintflow_be
          ref: develop
          path: backend

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Start backend
        working-directory: backend
        env:
          NODE_ENV: test
          PORT: 5000
          MONGODB_URI: mongodb://localhost:27017/flintflow_e2e
          JWT_SECRET: e2e-secret-not-a-real-key
          JWT_REFRESH_SECRET: e2e-refresh-not-a-real-key
        run: |
          npm run dev > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5000/health > /dev/null && exit 0
            sleep 2
          done
          echo "backend không lên sau 120s"; cat backend.log; exit 1

      - name: Seed e2e account
        env:
          E2E_EMAIL: fixture@flintflow.io
          E2E_PASSWORD: fixture-password-123
        run: |
          curl -sf -X POST http://localhost:5000/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$E2E_EMAIL\",\"password\":\"$E2E_PASSWORD\",\"name\":\"E2E\"}" || true

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
        run: npm run build

      - name: Run e2e
        env:
          CI: "1"
          NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
          E2E_API_URL: http://localhost:5000/api/v1
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
